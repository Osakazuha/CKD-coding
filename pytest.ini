[pytest]
testpaths =
    tests
    manuscript/tests
norecursedirs =
    artifacts
    logs
    _removed_*
addopts = -m "not walkthrough and not release_artifact"
markers =
    release_artifact: reads a completed, verified isolated artifact run
    walkthrough: code-walkthrough manual tests; the manual is not part of the released tree (run with -m walkthrough when reports/code_walkthrough/ is present)
filterwarnings =
    ignore:.*encountered in matmul:RuntimeWarning
    ignore:.*divide by zero encountered in matmul:RuntimeWarning
